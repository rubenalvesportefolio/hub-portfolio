<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" data-i18n-attr="content:meta.work.desc" content="Selected 3D and graphic design work by Ruben Alves.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ruben Alves">
  <meta property="og:title" content="Work - Ruben Alves">
  <meta property="og:description" content="Selected 3D and graphic design work by Ruben Alves.">
  <meta property="og:image" content="images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ruben Alves - 3D artist and graphic designer: selected renders">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="pt_PT">
  <meta name="twitter:card" content="summary_large_image">
  <title data-i18n="meta.work.title">Work - Ruben Alves</title>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script src="display-mode.js"></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="page-bg" aria-hidden="true">
    <div class="page-bg-scrim"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="index.html" data-i18n-attr="aria-label:nav.aria.brand" aria-label="Homepage">
      <span class="brand-mark">RA</span>
      <span>RUBEN ALVES</span>
    </a>
    <nav class="nav" data-i18n-attr="aria-label:nav.aria.primary" aria-label="Primary navigation">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="work.html" class="active" data-i18n="nav.work">Work</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
      <a class="nav-cv wave-cta" href="cv.pdf" download data-i18n="nav.cv">Download CV ↓</a>
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:nav.aria.language" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en" data-i18n-attr="aria-label:nav.aria.langEn" aria-label="Switch to English" aria-pressed="true">EN</button>
        <button type="button" class="lang-btn" data-lang="pt" data-i18n-attr="aria-label:nav.aria.langPt" aria-label="Mudar para português" aria-pressed="false">PT</button>
      </div>
    </nav>
    <button type="button" class="menu-toggle" data-i18n-attr="aria-label:nav.aria.menu" aria-label="Open menu" aria-expanded="false">☰</button>
    <div class="display-settings">
      <button type="button" class="settings-toggle" aria-expanded="false" aria-controls="display-panel" data-i18n-attr="aria-label:settings.aria.open" aria-label="Display settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <div class="settings-panel" id="display-panel" hidden>
        <p class="eyebrow" data-i18n="settings.title">Display</p>
        <div class="mode-row">
          <span id="mode-switch-label" data-i18n="settings.full">Full experience</span>
          <button type="button" class="mode-switch" role="switch" aria-checked="true" aria-labelledby="mode-switch-label"><span class="mode-switch-knob"></span></button>
        </div>
        <p class="mode-note mode-note-full" data-i18n="settings.note.full">Animations on.</p>
        <p class="mode-note mode-note-lite" data-i18n="settings.note.lite">Lite mode: no animations - easier on your battery.</p>
      </div>
    </div>
  </header>

  <main>
    <section class="work-page">
      <div class="work-intro">
        <p class="eyebrow" data-i18n="work.eyebrow">SELECTED WORK</p>
        <h1><span data-i18n="work.title.line1">Projects with</span> <em data-i18n="work.title.line2">a point of view.</em></h1>
        <p data-i18n="work.intro">Pick a category, then search by tag to narrow the results - separate multiple tags with a comma.</p>
      </div>

      <div class="work-tabs" role="tablist" data-i18n-attr="aria-label:work.tabs.aria" aria-label="Work categories">
        <button type="button" class="tab-btn active" role="tab" aria-selected="true" aria-controls="gallery-panel" data-tab="3d" data-i18n="tab.3d">3D</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="gallery-panel" data-tab="graphic" data-i18n="tab.graphic">Graphic Design</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="gallery-panel" data-tab="3dprint" data-i18n="tab.3dprint">3D Printable</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="gallery-panel" data-tab="contests" data-i18n="tab.contests">Contests</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="gallery-panel" data-tab="commissions" data-i18n="tab.commissions">Commissions</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="gallery-panel" data-tab="games" hidden data-i18n="tab.games">Games</button>
      </div>

      <div class="work-search">
        <span class="work-search-icon" aria-hidden="true">⌕</span>
        <input
          type="search"
          data-gallery-search
          list="tag-options"
          placeholder="Search by tag - e.g. 3D Modelling"
          aria-label="Search projects by tag"
          data-i18n-attr="aria-label:work.search.aria"
        >
      </div>
      <datalist id="tag-options"></datalist>

      <div class="gallery-grid" id="gallery-panel" role="tabpanel" tabindex="0" data-gallery-grid></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
